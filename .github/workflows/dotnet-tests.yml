name: .NET Unit Tests

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore main project
      run: dotnet restore GLMS_ST10445830_Submission/GLMS_ST10445830/GLMS_ST10445830.csproj

    - name: Build main project
      run: dotnet build GLMS_ST10445830_Submission/GLMS_ST10445830/GLMS_ST10445830.csproj --configuration Release --no-restore

    - name: Restore test project
      run: dotnet restore GLMS_ST10445830_Submission/GLMS_ST10445830.Tests/GLMS_ST10445830.Tests.csproj

    - name: Build test project
      run: dotnet build GLMS_ST10445830_Submission/GLMS_ST10445830.Tests/GLMS_ST10445830.Tests.csproj --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test GLMS_ST10445830_Submission/GLMS_ST10445830.Tests/GLMS_ST10445830.Tests.csproj --configuration Release --no-build --verbosity normal
