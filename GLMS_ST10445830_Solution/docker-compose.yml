services:
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Password123"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    # Report healthy only once SQL Server accepts logins, so the API doesn't start too early
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  glms-backend-api:
    build:
      context: .
      dockerfile: GLMS_ST10445830.API/Dockerfile
    container_name: glms-backend-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:80"
      ConnectionStrings__DefaultConnection: "Server=sql-server-db;Database=GLMS_DB;User=sa;Password=YourStrong!Password123;TrustServerCertificate=True;"
    ports:
      - "5001:80"
    depends_on:
      sql-server-db:
        condition: service_healthy
    # Safety net: if the API still fails at startup (e.g. migration error), try again
    restart: on-failure

  glms-frontend-web:
    build:
      context: .
      dockerfile: GLMS_ST10445830/Dockerfile
    container_name: glms-frontend-web
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:80"
      ApiBaseUrl: "http://glms-backend-api:80"
    ports:
      - "5000:80"
    depends_on:
      - glms-backend-api

volumes:
  sql-data:
