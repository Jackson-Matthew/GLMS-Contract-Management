services:
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: glms-sql-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Password123"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql

  glms-backend-api:
    build:
      context: .
      dockerfile: GLMS_ST10445830.API/Dockerfile
    container_name: glms-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:80"
      ConnectionStrings__DefaultConnection: "Server=sql-server-db;Database=GLMS_DB;User=sa;Password=YourStrong!Password123;TrustServerCertificate=True;"
    ports:
      - "5001:80"
    depends_on:
      - sql-server-db

volumes:
  sql-data: